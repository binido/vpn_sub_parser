[package]
name = "vpn-sub-parser"
version = "0.1.1"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vpn_sub_parser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
# ponytail: zune-jpeg (транзитивно через image → tauri) без фичи "log" разворачивает
# warn! в пустоту, что rustc 1.96+ считает ошибкой. Включаем фичу — убрать, когда
# выйдет исправленный zune-jpeg.
zune-jpeg = { version = "0.5", features = ["log"] }

# Бинарник в релизе едет с отладочными символами и весит втрое больше нужного.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
